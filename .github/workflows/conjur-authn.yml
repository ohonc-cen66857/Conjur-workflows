name: Conjur Authentication

on:

  workflow_call:

    inputs:

      host-id:
        required: true
        type: string

    secrets:

      CONJUR_APIKEY:
        required: true

    outputs:

      conjur_token:
        value: ${{ jobs.auth.outputs.conjur_token }}

      edge:
        value: ${{ jobs.auth.outputs.edge }}

jobs:

  auth:

    runs-on: ubuntu-latest

    outputs:

      conjur_token: ${{ steps.auth.outputs.conjur_token }}
      edge: ${{ steps.auth.outputs.edge }}

    steps:

      - name: Authenticate
        id: auth

        env:
          EDGE: https://csas-sandbox.secretsmgr.cyberark.cloud
          API_KEY: ${{ secrets.CONJUR_APIKEY }}

        run: |

          HOST_ID="${{ inputs.host-id }}"

          LOGIN_ENC="host%2F$(printf '%s' "$HOST_ID" | sed 's|/|%2F|g')"

          TOKEN=$(curl -sk \
            --request POST \
            "$EDGE/api/authn/conjur/$LOGIN_ENC/authenticate" \
            --header "Content-Type: application/json" \
            --header "Accept-Encoding: base64" \
            --data "$API_KEY")

          echo "Token Length: ${#TOKEN}"

          if [ ${#TOKEN} -lt 100 ]; then
            echo "Authentication failed"
            exit 1
          fi

         

          echo "conjur_token=$TOKEN" >> "$GITHUB_OUTPUT"
          echo "edge=$EDGE" >> "$GITHUB_OUTPUT"

      - name: Debug Step Outputs

        run: |

          echo "STEP TOKEN=[${{ steps.auth.outputs.conjur_token }}]"
          echo "STEP EDGE=[${{ steps.auth.outputs.edge }}]"
