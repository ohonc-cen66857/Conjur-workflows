name: Create Or Update Conjur Secret

on:

  workflow_dispatch:

    inputs:

      sas:
        description: "SAS Name (e.g. pim)"
        required: true
        type: string

      env:
        description: "Environment (dev/int/prs/pred/prod)"
        required: true
        type: string

      variable-name:
        description: "Variable Name"
        required: true
        type: string

      secret-value:
        description: "Secret Value"
        required: true
        type: string

jobs:

  auth:

    uses: ./.github/workflows/conjur-authn.yml

    with:
      host-id: data/workloads/${{ inputs.sas }}-${{ inputs.env }}

    secrets:
      CONJUR_APIKEY: ${{ secrets.CONJUR_APIKEY }}

  create-and-set:

    needs: auth

    runs-on: ubuntu-latest

    steps:

      - name: Debug Outputs

        run: |

          echo "EDGE=[${{ needs.auth.outputs.edge }}]"

          if [ -z "${{ needs.auth.outputs.conjur-token }}" ]; then
            echo "TOKEN EMPTY"
            exit 1
          fi

          echo "TOKEN RECEIVED"

      - name: Calculate Paths
        id: calc

        run: |

          SAS="${{ inputs.sas }}"
          ENV="${{ inputs.env }}"

          POLICY_PATH="data/app_storage/$SAS/$SAS-$ENV"
          MANAGE_GROUP="data/app_storage/$SAS/manage-$ENV"

          echo "policy-path=$POLICY_PATH" >> $GITHUB_OUTPUT
          echo "manage-group=$MANAGE_GROUP" >> $GITHUB_OUTPUT

      - name: Generate Policy

        run: |

          cat > variable.yml <<EOF
          - !variable ${{ inputs.variable-name }}

          - !permit
            role: !group ${{ steps.calc.outputs.manage-group }}
            privileges: [ read, execute, update ]
            resource: !variable ${{ inputs.variable-name }}
          EOF

          cat variable.yml

      - name: Create Variable

        env:
          EDGE: ${{ needs.auth.outputs.edge }}
          TOKEN: ${{ needs.auth.outputs.conjur-token }}

        run: |

          POLICY_ENC=$(printf '%s' "${{ steps.calc.outputs.policy-path }}" | sed 's|/|%2F|g')

          curl -sk \
            -X PATCH \
            -H "Authorization: Token token=$TOKEN" \
            -H "Content-Type: application/yaml" \
            --data-binary @variable.yml \
            "$EDGE/api/policies/conjur/policy/$POLICY_ENC"

      - name: Set Secret Value

        env:
          EDGE: ${{ needs.auth.outputs.edge }}
          TOKEN: ${{ needs.auth.outputs.conjur-token }}

        run: |

          VARIABLE_PATH="${{ steps.calc.outputs.policy-path }}/${{ inputs.variable-name }}"

          VARIABLE_ENC=$(printf '%s' "$VARIABLE_PATH" | sed 's|/|%2F|g')

          curl -sk \
            -X POST \
            -H "Authorization: Token token=$TOKEN" \
            --data-binary "${{ inputs.secret-value }}" \
            "$EDGE/api/secrets/conjur/variable/$VARIABLE_ENC"

      - name: Summary

        run: |

          echo "Created/Updated:"
          echo "${{ steps.calc.outputs.policy-path }}/${{ inputs.variable-name }}"

          echo "Manage Group:"
          echo "${{ steps.calc.outputs.manage-group }}"
