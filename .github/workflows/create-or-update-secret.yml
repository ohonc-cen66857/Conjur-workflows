name: Create Or Update Conjur Secret

run-name: >-
  Conjur secret ${{ inputs.sas }} / ${{ inputs.environment }} /
  ${{ inputs.variable_name }} by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      sas:
        description: "SAS name, for example ondra"
        required: true
        type: string

      environment:
        description: "Environment, for example dev, int, prs, pred or prod"
        required: true
        type: string

      variable_name:
        description: "Variable name"
        required: true
        type: string

      secret_value:
        description: "Secret value. Use Secure Browser. Value is not stored in the repository."
        required: true
        type: string

permissions:
  contents: read

jobs:
  create_and_set:
    name: Create variable and set value
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Protect secret value in subsequent logs
        shell: bash
        env:
          VALUE_TO_MASK: ${{ inputs.secret_value }}

        run: |
          if [ -z "$VALUE_TO_MASK" ]; then
            echo "Secret value must not be empty."
            exit 1
          fi

          echo "::add-mask::$VALUE_TO_MASK"
          echo "Secret value received and protected for subsequent workflow steps."

      - name: Validate inputs
        shell: bash
        env:
          SAS: ${{ inputs.sas }}
          ENVIRONMENT: ${{ inputs.environment }}
          VARIABLE_NAME: ${{ inputs.variable_name }}

        run: |
          if [[ ! "$SAS" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
            echo "Invalid SAS name: $SAS"
            exit 1
          fi

          if [[ ! "$ENVIRONMENT" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
            echo "Invalid environment: $ENVIRONMENT"
            exit 1
          fi

          if [[ ! "$VARIABLE_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]]; then
            echo "Invalid variable name."
            exit 1
          fi

      - name: Authenticate to Conjur
        uses: ./.github/actions/conjur-authn
        with:
          host-id: data/workloads/${{ inputs.sas }}-${{ inputs.environment }}
          api-key: ${{ secrets.CONJUR_APIKEY }}

      - name: Calculate Conjur paths
        id: paths
        shell: bash
        env:
          SAS: ${{ inputs.sas }}
          ENVIRONMENT: ${{ inputs.environment }}

        run: |
          POLICY_PATH="data/app_storage/$SAS/$SAS-$ENVIRONMENT"
          MANAGE_GROUP="/data/app_storage/$SAS/manage-$ENVIRONMENT"

          echo "policy_path=$POLICY_PATH" >> "$GITHUB_OUTPUT"
          echo "manage_group=$MANAGE_GROUP" >> "$GITHUB_OUTPUT"

      - name: Generate variable policy
        shell: bash
        env:
          VARIABLE_NAME: ${{ inputs.variable_name }}
          MANAGE_GROUP: ${{ steps.paths.outputs.manage_group }}

        run: |
          cat > variable.yml <<EOF
          - !variable $VARIABLE_NAME

          - !permit
            role: !group $MANAGE_GROUP
            privileges: [ read, execute, update ]
            resource: !variable $VARIABLE_NAME
          EOF

          echo "Generated Conjur policy:"
          cat variable.yml

      - name: Create Conjur variable
        shell: bash
        env:
          POLICY_PATH: ${{ steps.paths.outputs.policy_path }}

        run: |
          POLICY_ENC="$(printf '%s' "$POLICY_PATH" | sed 's|/|%2F|g')"
          RESPONSE_FILE="$(mktemp)"

          cleanup() {
            rm -f "$RESPONSE_FILE"
          }

          trap cleanup EXIT

          HTTP_CODE="$(curl -sS -k \
            --output "$RESPONSE_FILE" \
            --write-out "%{http_code}" \
            --request PATCH \
            --header "Authorization: Token token=\"$CONJUR_TOKEN\"" \
            --header "Content-Type: application/yaml" \
            --data-binary @variable.yml \
            "$CONJUR_EDGE/api/policies/conjur/policy/$POLICY_ENC")"

          echo "Policy update HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "Conjur policy update failed."

            if [ -s "$RESPONSE_FILE" ]; then
              cat "$RESPONSE_FILE"
            fi

            exit 1
          fi

          echo "Conjur variable successfully created or confirmed."

      - name: Set secret value
        shell: bash
        env:
          POLICY_PATH: ${{ steps.paths.outputs.policy_path }}
          VARIABLE_NAME: ${{ inputs.variable_name }}
          SECRET_VALUE: ${{ inputs.secret_value }}

        run: |
          VARIABLE_PATH="$POLICY_PATH/$VARIABLE_NAME"
          VARIABLE_ENC="$(printf '%s' "$VARIABLE_PATH" | sed 's|/|%2F|g')"
          RESPONSE_FILE="$(mktemp)"

          cleanup() {
            rm -f "$RESPONSE_FILE"
          }

          trap cleanup EXIT

          HTTP_CODE="$(
            printf '%s' "$SECRET_VALUE" |
              curl -sS -k \
                --output "$RESPONSE_FILE" \
                --write-out "%{http_code}" \
                --request POST \
                --header "Authorization: Token token=\"$CONJUR_TOKEN\"" \
                --data-binary @- \
                "$CONJUR_EDGE/api/secrets/conjur/variable/$VARIABLE_ENC"
          )"

          echo "Set secret HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "Setting the secret failed."

            if [ -s "$RESPONSE_FILE" ]; then
              cat "$RESPONSE_FILE"
            fi

            exit 1
          fi

          echo "Secret value successfully stored."

      - name: Remove temporary policy file
        if: always()
        shell: bash

        run: |
          rm -f variable.yml

      - name: Operation summary
        if: success()
        shell: bash
        env:
          POLICY_PATH: ${{ steps.paths.outputs.policy_path }}
          VARIABLE_NAME: ${{ inputs.variable_name }}
          MANAGE_GROUP: ${{ steps.paths.outputs.manage_group }}
          ACTOR: ${{ github.actor }}
          RUN_ID: ${{ github.run_id }}

        run: |
          echo "Conjur operation completed successfully."
          echo "Actor: $ACTOR"
          echo "Variable path: $POLICY_PATH/$VARIABLE_NAME"
          echo "Management group: $MANAGE_GROUP"
          echo "Workflow run ID: $RUN_ID"
