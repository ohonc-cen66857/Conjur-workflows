name: Share Conjur Secret

on:

  workflow_dispatch:

    inputs:

      sas:
        description: "SAS name, for example ondra"
        required: true
        type: string

      env:
        description: "Environment containing the variable"
        required: true
        type: string

      variable-name:
        description: "Variable name"
        required: true
        type: string

      target-group:
        description: "Target group path, absolute or without the initial slash"
        required: true
        type: string

jobs:

  share-secret:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate inputs
        shell: bash
        env:
          SAS: ${{ inputs.sas }}
          ENVIRONMENT: ${{ inputs.env }}
          VARIABLE_NAME: ${{ inputs.variable-name }}
          TARGET_GROUP: ${{ inputs.target-group }}

        run: |

          if [[ ! "$SAS" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
            echo "Invalid SAS name: $SAS"
            exit 1
          fi

          if [[ ! "$ENVIRONMENT" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
            echo "Invalid environment: $ENVIRONMENT"
            exit 1
          fi

          if [[ ! "$VARIABLE_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]]; then
            echo "Invalid variable name."
            exit 1
          fi

          if [ -z "$TARGET_GROUP" ]; then
            echo "Target group must not be empty."
            exit 1
          fi

      - name: Authenticate to Conjur
        uses: ./.github/actions/conjur-authn
        with:

          host-id: data/workloads/${{ inputs.sas }}-${{ inputs.env }}

          api-key: ${{ secrets.CONJUR_APIKEY }}

      - name: Calculate Conjur paths
        id: paths
        shell: bash
        env:
          SAS: ${{ inputs.sas }}
          ENVIRONMENT: ${{ inputs.env }}
          TARGET_GROUP_INPUT: ${{ inputs.target-group }}

        run: |

          POLICY_PATH="data/app_storage/$SAS/$SAS-$ENVIRONMENT"

          TARGET_GROUP="/${TARGET_GROUP_INPUT#/}"

          echo "policy_path=$POLICY_PATH" >> "$GITHUB_OUTPUT"
          echo "target_group=$TARGET_GROUP" >> "$GITHUB_OUTPUT"

      - name: Generate variable permit
        shell: bash
        env:
          VARIABLE_NAME: ${{ inputs.variable-name }}
          TARGET_GROUP: ${{ steps.paths.outputs.target_group }}

        run: |

          cat > permit.yml <<EOF
          - !permit
            role: !group $TARGET_GROUP
            privileges: [ read, execute ]
            resource: !variable $VARIABLE_NAME
          EOF

          echo "Generated permit:"
          cat permit.yml

      - name: Add variable permit
        shell: bash
        env:
          POLICY_PATH: ${{ steps.paths.outputs.policy_path }}

        run: |

          POLICY_ENC=$(printf '%s' "$POLICY_PATH" | sed 's|/|%2F|g')

          RESPONSE_FILE=$(mktemp)

          HTTP_CODE=$(curl -sS -k \
            --output "$RESPONSE_FILE" \
            --write-out "%{http_code}" \
            --request PATCH \
            --header "Authorization: Token token=\"$CONJUR_TOKEN\"" \
            --header "Content-Type: application/yaml" \
            --data-binary @permit.yml \
            "$CONJUR_EDGE/api/policies/conjur/policy/$POLICY_ENC")

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "Adding the permit failed with HTTP status $HTTP_CODE."
            cat "$RESPONSE_FILE"
            rm -f "$RESPONSE_FILE"
            exit 1
          fi

          rm -f "$RESPONSE_FILE"

          echo "Variable permit successfully added."

      - name: Remove temporary policy file
        if: always()
        shell: bash

        run: |

          rm -f permit.yml

      - name: Summary
        shell: bash
        env:
          POLICY_PATH: ${{ steps.paths.outputs.policy_path }}
          VARIABLE_NAME: ${{ inputs.variable-name }}
          TARGET_GROUP: ${{ steps.paths.outputs.target_group }}

        run: |

          echo "Variable path: $POLICY_PATH/$VARIABLE_NAME"
          echo "Shared with: $TARGET_GROUP"
